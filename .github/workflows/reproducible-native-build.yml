name: Reproducible native build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the pinned native environment
        run: docker build --file containers/native-build.Dockerfile --tag datumloopds-native:locked .
      - name: Build, run native tests, and launch the headless shell
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" datumloopds-native:locked
