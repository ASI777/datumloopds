name: DatumLoop NVIDIA GPU viewport smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-nvidia-viewport:
    # Install this runner on an Ubuntu desktop/X11 session with the NVIDIA
    # driver, native build dependencies, XTest, and these runner labels.
    runs-on: [self-hosted, linux, x64, nvidia, x11]
    timeout-minutes: 15
    env:
      DATUMLOOPDS_EXECUTABLE: ${{ github.workspace }}/build/apps/datumloop-desktop/DatumLoopDS
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the native desktop application
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DDATUMLOOP_ENABLE_MFEM=OFF
          cmake --build build --parallel 2
      - name: Verify native CAD, input, and structural field rendering on NVIDIA
        run: python3 scripts/native_gpu_smoke.py --report artifacts/native-gpu/report.json
      - name: Upload GPU metadata and viewport frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-nvidia-viewport-${{ github.run_id }}
          path: artifacts/native-gpu/
          if-no-files-found: warn
