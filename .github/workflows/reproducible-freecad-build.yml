name: Reproducible FreeCAD 1.1.3 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out DatumLoop DS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the pinned FreeCAD fork and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ASI777/FreeCAD
          ref: b6b11c9cabeeee14fd192856f5749af620ea7183
          path: freecad-source
          submodules: recursive
          persist-credentials: false

      - name: Build the pinned FreeCAD environment
        run: docker build --platform linux/amd64 --file containers/freecad-1.1.3-build.Dockerfile --tag datumloopds-freecad:locked .

      - name: Clean build, install, and run FreeCAD project and GUI smokes
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --volume "$GITHUB_WORKSPACE/freecad-source:/freecad-source:ro"
          --env FREECAD_SOURCE_REVISION=b6b11c9cabeeee14fd192856f5749af620ea7183
          datumloopds-freecad:locked
